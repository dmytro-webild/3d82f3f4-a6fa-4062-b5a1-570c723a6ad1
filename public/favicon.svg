<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7eaaf"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6308"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2632"/>
      <stop offset="100%" stop-color="#031219"/>
    </linearGradient>
  </defs>

  <!-- Outer Container with Metallic Gold Border -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Architectural 3D Pool Cage Mansard Frame -->
  <path d="M 18 78 L 18 48 L 38 28 L 62 28 L 82 48 L 82 78" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="18" y1="78" x2="82" y2="78" stroke="url(#cyanGrad)" stroke-width="3"/>
  <line x1="18" y1="48" x2="82" y2="48" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="50" y1="28" x2="50" y2="78" stroke="url(#cyanGrad)" stroke-width="1.8"/>

  <!-- Florida Palm Leaf Crown Accent -->
  <path d="M 50 72 C 50 48, 30 38, 20 42 C 34 38, 46 44, 50 72 Z" fill="url(#goldGrad)"/>
  <path d="M 50 72 C 50 48, 70 38, 80 42 C 66 38, 54 44, 50 72 Z" fill="url(#goldGrad)"/>
  <path d="M 50 72 C 50 38, 40 22, 30 18 C 42 22, 48 34, 50 72 Z" fill="url(#goldGrad)"/>
  <path d="M 50 72 C 50 38, 60 22, 70 18 C 58 22, 52 34, 50 72 Z" fill="url(#goldGrad)"/>

  <!-- Gold Starburst Diamond Peak -->
  <polygon points="50,14 53,20 50,26 47,20" fill="url(#goldGrad)"/>
</svg>