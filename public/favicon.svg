<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041C24" />
      <stop offset="100%" stop-color="#0B4F6C" />
    </linearGradient>
    <linearGradient id="cageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#90E0EF" />
    </linearGradient>
    <pattern id="screenMesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#00F5D4" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Tropical Pool Water Layer -->
  <path d="M 12 92 C 36 84, 60 98, 84 90 C 100 85, 116 92, 116 92 L 116 112 C 116 116, 112 120, 108 120 L 20 120 C 16 120, 12 116, 12 112 Z" fill="url(#waterGrad)" opacity="0.85" />
  <path d="M 12 98 C 40 92, 70 102, 116 96 L 116 120 L 12 120 Z" fill="#90E0EF" opacity="0.2" />

  <!-- Screen Cage Mesh Texture -->
  <path d="M 18 96 L 18 52 Q 64 16 110 52 L 110 96 Z" fill="url(#screenMesh)" opacity="0.75" />

  <!-- Structural Aluminum Beam Cage Frame -->
  <path d="M 16 96 L 16 50 Q 64 12 112 50 L 112 96" stroke="url(#cageGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Horizontal Tie-Beam -->
  <line x1="16" y1="64" x2="112" y2="64" stroke="url(#cageGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Main Arch Roof Spine & Support Beams -->
  <line x1="64" y1="21" x2="64" y2="96" stroke="url(#cageGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="38" y1="36" x2="38" y2="96" stroke="url(#cageGrad)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.9" />
  <line x1="90" y1="36" x2="90" y2="96" stroke="url(#cageGrad)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.9" />
  <!-- Inner Screen Dome Outline -->
  <path d="M 28 84 Q 64 36 100 84" stroke="#70E0D0" stroke-width="2" fill="none" opacity="0.7" />

  <!-- Sun Highlight Accent -->
  <circle cx="96" cy="30" r="10" fill="#FFB703" opacity="0.9" />
  <circle cx="96" cy="30" r="16" fill="#FFB703" opacity="0.25" />
</svg>